<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Вишлист</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&amp;display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #F7F0E8;
    --card: #FFFBF6;
    --text: #3B2620;
    --muted: #7A625A;
    --border: #EADCCF;
    --hero: #93716D;
    --hero-text: #FBF3EA;
    --accent: #5A2E24;
    --accent-text: #FBF3EA;
    --mine: #9C3B4E;
    --mine-soft: #F6DDDD;
    --tint-1: #F2D3D3;
    --tint-2: #F0DCCB;
    --tint-3: #DCC6D1;
    --placeholder-icon: #7A5A55;
    --banner-bg: #E6D6DF;
    --banner-text: #4A2F3C;
    --toast-bg: #3B2620;
    --toast-text: #FBF3EA;
    --radius: 22px;
    --serif: "Playfair Display", Georgia, "Times New Roman", serif;
  }
  :root[data-theme="dark"] {
    --bg: #211815;
    --card: #2D221E;
    --text: #F4E9E1;
    --muted: #C2ADA3;
    --border: #3E302A;
    --hero: #5E4642;
    --hero-text: #FBF3EA;
    --accent: #E9C9B8;
    --accent-text: #3B2620;
    --mine: #EFA3B3;
    --mine-soft: #4A2C33;
    --tint-1: #4A3336;
    --tint-2: #4A3A30;
    --tint-3: #413541;
    --placeholder-icon: #D9C1B6;
    --banner-bg: #413541;
    --banner-text: #EEDDE6;
    --toast-bg: #F4E9E1;
    --toast-text: #211815;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    min-height: 100vh;
  }
  .app { max-width: 560px; margin: 0 auto; padding: 0 16px calc(32px + env(safe-area-inset-bottom)); }

  /* Шапка — полоса цвета какао, как в референсе */
  .header {
    text-align: center;
    margin: 0 -16px 20px; padding: 28px 24px 30px;
    background: var(--hero); color: var(--hero-text);
    border-radius: 0 0 32px 32px;
  }
  .cover {
    width: 120px; height: 120px; margin: 0 auto 16px;
    border-radius: 50%; overflow: hidden;
    background: var(--bg);
    border: 4px solid var(--tint-1);
    display: flex; align-items: center; justify-content: center;
  }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover .emoji { font-size: 60px; line-height: 1; }
  .title { margin: 0; font-family: var(--serif); font-size: 30px; line-height: 1.15; font-weight: 600; }

  /* Плашка «только просмотр» */
  .banner {
    background: var(--banner-bg); color: var(--banner-text);
    border-radius: 12px; padding: 10px 14px; margin-bottom: 14px;
    font-size: 14px; text-align: center;
  }

  /* Список */
  .list { display: flex; flex-direction: column; gap: 12px; list-style: none; margin: 0; padding: 0; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    display: flex; flex-direction: column; gap: 12px;
    transition: opacity .2s, border-color .2s, background .2s;
  }
  .card.is-taken { opacity: .5; }
  .card.is-mine {
    border: 2px solid var(--mine);
    background: var(--mine-soft);
    padding: 11px;
  }
  .card-top { display: flex; gap: 12px; align-items: flex-start; }
  .photo {
    flex: none; width: 88px; height: 88px; border-radius: 12px; overflow: hidden;
    background: var(--tint-1);
    display: flex; align-items: center; justify-content: center; color: var(--placeholder-icon);
  }
  .card:nth-child(3n+2) .photo { background: var(--tint-2); }
  .card:nth-child(3n) .photo { background: var(--tint-3); }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo svg { width: 32px; height: 32px; }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .gift-title { margin: 0; font-family: var(--serif); font-size: 19px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .meta { font-size: 13px; color: var(--muted); }
  .shop {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 4px;
    min-height: 32px; padding: 0; margin-top: 2px;
    background: none; border: 0; color: var(--accent);
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .shop svg { width: 14px; height: 14px; }

  .actions { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 600; color: var(--muted);
  }
  .badge.mine { color: var(--mine); }
  .badge svg { width: 16px; height: 16px; }

  .check {
    display: flex; align-items: center; gap: 10px;
    min-height: 44px; width: 100%;
    padding: 0 16px; border-radius: 999px;
    background: var(--bg); cursor: pointer; font-weight: 600; font-size: 15px;
    user-select: none;
  }
  .check input { position: absolute; opacity: 0; pointer-events: none; }
  .box {
    flex: none; width: 22px; height: 22px; border-radius: 7px;
    border: 2px solid var(--muted);
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, border-color .15s;
  }
  .box svg { width: 14px; height: 14px; color: var(--accent-text); opacity: 0; }
  .check input:checked + .box { background: var(--accent); border-color: var(--accent); }
  .check input:checked + .box svg { opacity: 1; }
  .check input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn {
    min-height: 44px; padding: 0 20px; border-radius: 999px;
    border: 1.5px solid var(--accent); background: transparent; color: var(--accent);
    font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn:disabled, .check.disabled { opacity: .6; cursor: default; }

  .spinner {
    width: 18px; height: 18px; flex: none;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Скелетон и ошибка */
  .skeleton { height: 138px; border-radius: var(--radius); background: var(--tint-2); animation: pulse 1.2s ease-in-out infinite; }
  .skeleton.head { width: 120px; height: 120px; border-radius: 50%; margin: 28px auto 14px; }
  .skeleton.line { height: 24px; width: 60%; margin: 0 auto 20px; border-radius: 8px; }
  @keyframes pulse { 50% { opacity: .55; } }
  .error { text-align: center; padding: 64px 24px; }
  .error .emoji { font-size: 48px; margin-bottom: 12px; }
  .error h2 { font-family: var(--serif); font-size: 22px; margin: 0 0 20px; font-weight: 600; }
  .error p { margin: 0 0 20px; color: var(--muted); }

  /* Тост */
  .toast {
    position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    max-width: calc(100% - 32px); width: max-content;
    background: var(--toast-bg); color: var(--toast-text);
    padding: 12px 16px; border-radius: 14px; font-size: 14px; text-align: center;
    box-shadow: 0 6px 24px rgba(0,0,0,.18);
    transition: opacity .2s, transform .2s; z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var API_URL = 'https://script.google.com/macros/s/AKfycbxxmR0mEpeWsT3cxjbGl-dqlxbQsLdbsInzK88Etgz5Ju66xmaYSWrspUz3_7AGXgPwaA/exec';
  var LOAD_TIMEOUT_MS = 8000;
  var ACTION_TIMEOUT_MS = 20000;
  var GUEST_KEY = 'wishlist_guest_id';

  /* ---------- Telegram ---------- */
  var tg = (window.Telegram && window.Telegram.WebApp) || null;
  try { tg && tg.ready(); } catch (e) {}
  try { tg && tg.expand(); } catch (e) {}

  function applyTheme() {
    var dark = false;
    if (tg && tg.colorScheme) dark = tg.colorScheme === 'dark';
    else if (window.matchMedia) dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    try { tg && tg.setHeaderColor && tg.setHeaderColor(bg); } catch (e) {}
    try { tg && tg.setBackgroundColor && tg.setBackgroundColor(bg); } catch (e) {}
  }
  applyTheme();
  try { tg && tg.onEvent && tg.onEvent('themeChanged', applyTheme); } catch (e) {}

  var initData = (tg && tg.initData) || '';

  /* ---------- guestId ---------- */
  function randomId(len) {
    var chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    var out = '', i;
    try {
      var arr = new Uint32Array(len);
      window.crypto.getRandomValues(arr);
      for (i = 0; i < len; i++) out += chars[arr[i] % chars.length];
      return out;
    } catch (e) {
      for (i = 0; i < len; i++) out += chars[Math.floor(Math.random() * chars.length)];
      return out;
    }
  }
  var memoryGuestId = null;
  function getGuestId() {
    var id = null;
    try { id = window.localStorage.getItem(GUEST_KEY); } catch (e) { id = memoryGuestId; }
    if (id && /^[A-Za-z0-9]+$/.test(id)) return id;
    id = randomId(20);
    try { window.localStorage.setItem(GUEST_KEY, id); } catch (e) {}
    memoryGuestId = id;
    return id;
  }
  var guestId = getGuestId();

  /* ---------- Состояние ---------- */
  var state = {
    data: null,       // { title, coverImage, gifts }
    readOnly: false,  // true — данные из запасного data.json
    pending: {}       // id подарка → true, пока идёт запрос
  };

  /* ---------- Утилиты ---------- */
  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 3000);
  }

  function haptic(type) {
    try { tg.HapticFeedback.notificationOccurred(type); } catch (e) {}
  }

  function openLink(url) {
    try {
      if (tg && tg.openLink) { tg.openLink(url); return; }
    } catch (e) {}
    window.open(url, '_blank', 'noopener');
  }

  function askConfirm(text) {
    return new Promise(function (resolve) {
      if (tg && initData && tg.showConfirm) {
        try { tg.showConfirm(text, function (ok) { resolve(!!ok); }); return; } catch (e) {}
      }
      resolve(window.confirm(text));
    });
  }

  function fetchWithTimeout(url, options, ms) {
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var opts = options || {};
    if (ctrl) opts.signal = ctrl.signal;
    return new Promise(function (resolve, reject) {
      var t = setTimeout(function () {
        if (ctrl) ctrl.abort();
        reject(new Error('timeout'));
      }, ms);
      fetch(url, opts).then(function (r) { clearTimeout(t); resolve(r); },
                            function (e) { clearTimeout(t); reject(e); });
    });
  }

  function readJson(r) {
    if (!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }

  // Приводим ответ к виду data.json; null — если в нём нет списка
  function normalize(d) {
    if (!d || typeof d !== 'object') return null;
    if (!Array.isArray(d.gifts) && d.data && Array.isArray(d.data.gifts)) d = d.data;
    if (!Array.isArray(d.gifts)) return null;
    return {
      title: typeof d.title === 'string' ? d.title : (state.data ? state.data.title : ''),
      coverImage: typeof d.coverImage === 'string' ? d.coverImage : (state.data ? state.data.coverImage : ''),
      gifts: d.gifts.map(function (g, i) {
        return {
          id: g.id != null ? String(g.id) : 'gift-' + i,
          title: String(g.title || ''),
          photo: g.photo ? String(g.photo) : '',
          link: g.link ? String(g.link) : null,
          multi: !!g.multi,
          chosen: !!g.chosen,
          chosenCount: Number(g.chosenCount) || 0,
          mine: !!g.mine
        };
      })
    };
  }

  /* ---------- Иконки ---------- */
  var ICON = {
    gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8M12 8v13M12 8S10.5 3 8 4s-.5 4 4 4zM12 8s1.5-5 4-4 .5 4-4 4z"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    heart: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.1C1 8.5 3.2 5 6.6 5c2 0 3.4 1.1 4.4 2.5C12 6.1 13.4 5 15.4 5 18.8 5 21 8.5 21.5 11.9 19.5 16.4 12 21 12 21z"/></svg>',
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>'
  };

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ---------- Рендер ---------- */
  function renderLoading() {
    app.innerHTML = '<div class="skeleton head"></div><div class="skeleton line"></div>' +
      '<div class="list"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>';
  }

  function renderError() {
    app.innerHTML = '';
    var box = el('div', 'error');
    box.appendChild(el('div', 'emoji', '🎁'));
    box.appendChild(el('h2', null, 'Не удалось загрузить вишлист, попробуй позже'));
    var btn = el('button', 'btn primary', 'Обновить');
    btn.type = 'button';
    btn.addEventListener('click', load);
    box.appendChild(btn);
    app.appendChild(box);
  }

  function renderHeader(d) {
    var head = el('header', 'header');
    var cover = el('div', 'cover');
    if (d.coverImage) {
      var img = document.createElement('img');
      img.alt = '';
      img.src = d.coverImage;
      img.onerror = function () { cover.innerHTML = '<span class="emoji" aria-hidden="true">🎂</span>'; };
      cover.appendChild(img);
    } else {
      cover.innerHTML = '<span class="emoji" aria-hidden="true">🎂</span>';
    }
    head.appendChild(cover);
    head.appendChild(el('h1', 'title', d.title || 'Вишлист'));
    return head;
  }

  function renderCard(g) {
    var busy = !!state.pending[g.id];
    var takenByOther = !g.multi && g.chosen && !g.mine;

    var card = el('li', 'card');
    if (g.mine) card.classList.add('is-mine');
    if (takenByOther) card.classList.add('is-taken');
    card.setAttribute('aria-busy', busy ? 'true' : 'false');

    /* Верх: фото + информация */
    var top = el('div', 'card-top');
    var photo = el('div', 'photo');
    if (g.photo) {
      var img = document.createElement('img');
      img.alt = g.title;
      img.loading = 'lazy';
      img.src = g.photo;
      img.onerror = function () { photo.innerHTML = ICON.gift; };
      photo.appendChild(img);
    } else {
      photo.innerHTML = ICON.gift;
    }
    top.appendChild(photo);

    var info = el('div', 'info');
    info.appendChild(el('h2', 'gift-title', g.title));
    if (g.multi) {
      info.appendChild(el('div', 'meta', 'Можно выбрать нескольким'));
      if (g.chosenCount > 0) info.appendChild(el('div', 'meta', 'Уже выбрали: ' + g.chosenCount));
    }
    if (g.link) {
      var shop = el('button', 'shop');
      shop.type = 'button';
      shop.innerHTML = '<span>В магазин</span>' + ICON.arrow;
      shop.addEventListener('click', function () { openLink(g.link); });
      info.appendChild(shop);
    }
    top.appendChild(info);
    card.appendChild(top);

    /* Низ: состояние и действие */
    var actions = el('div', 'actions');

    if (g.mine) {
      var mineBadge = el('span', 'badge mine');
      mineBadge.innerHTML = ICON.check;
      mineBadge.appendChild(document.createTextNode('Твой выбор'));
      actions.appendChild(mineBadge);
      if (!state.readOnly) {
        if (busy) {
          actions.appendChild(el('div', 'spinner'));
        } else {
          var cancel = el('button', 'btn', 'Отменить');
          cancel.type = 'button';
          cancel.addEventListener('click', function () { onCancel(g); });
          actions.appendChild(cancel);
        }
      }
    } else if (takenByOther) {
      var takenBadge = el('span', 'badge');
      takenBadge.innerHTML = ICON.lock;
      takenBadge.appendChild(document.createTextNode('уже выбрали'));
      actions.appendChild(takenBadge);
    } else if (!state.readOnly) {
      var label = el('label', 'check' + (busy ? ' disabled' : ''));
      var input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = busy;
      input.disabled = busy;
      var box = el('span', 'box');
      box.innerHTML = ICON.check;
      label.appendChild(input);
      label.appendChild(box);
      label.appendChild(el('span', null, 'Я подарю это'));
      if (busy) {
        var sp = el('div', 'spinner');
        sp.style.marginLeft = 'auto';
        label.appendChild(sp);
      }
      input.addEventListener('change', function () {
        if (input.checked) onChoose(g);
      });
      actions.appendChild(label);
    } else {
      // Режим просмотра: свободный подарок без чекбокса
      actions.appendChild(el('span', 'badge', 'Свободен'));
    }

    card.appendChild(actions);
    return card;
  }

  function render() {
    var d = state.data;
    app.innerHTML = '';
    app.appendChild(renderHeader(d));
    if (state.readOnly) app.appendChild(el('div', 'banner', 'Список временно только для просмотра'));
    var list = el('ul', 'list');
    d.gifts.forEach(function (g) { list.appendChild(renderCard(g)); });
    app.appendChild(list);
  }

  /* ---------- Загрузка ---------- */
  function load() {
    renderLoading();
    var url = API_URL + '?v=' + Date.now() +
      '&initData=' + encodeURIComponent(initData) +
      '&guestId=' + encodeURIComponent(guestId);

    fetchWithTimeout(url, { cache: 'no-store' }, LOAD_TIMEOUT_MS)
      .then(readJson)
      .then(function (json) {
        var d = normalize(json);
        if (!d) throw new Error('bad api response');
        state.data = d;
        state.readOnly = false;
        render();
      })
      .catch(function () {
        return fetch('data.json?v=' + Date.now(), { cache: 'no-store' })
          .then(readJson)
          .then(function (json) {
            var d = normalize(json);
            if (!d) throw new Error('bad data.json');
            state.data = d;
            state.readOnly = true;
            render();
          });
      })
      .catch(renderError);
  }

  /* ---------- Выбор и отмена ---------- */
  function send(action, gift) {
    state.pending[gift.id] = true;
    render();

    fetchWithTimeout(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, title: gift.title, initData: initData, guestId: guestId })
    }, ACTION_TIMEOUT_MS)
      .then(readJson)
      .then(function (res) {
        delete state.pending[gift.id];
        var fresh = normalize(res);
        if (fresh) state.data = fresh;

        if (res && res.ok === true) {
          haptic('success');
        } else {
          var reason = res && res.reason;
          if (reason === 'already_chosen') toast('Этот подарок уже выбрал кто-то другой');
          else if (reason === 'not_yours') toast('Этот выбор сделал другой гость');
          else if (reason === 'no_user') toast('Открой вишлист через Telegram, чтобы выбрать подарок');
          else toast('Не получилось, попробуй ещё раз');
          haptic('error');
        }
        render();
      })
      .catch(function () {
        // Сеть/таймаут: карточка возвращается в прежнее состояние
        delete state.pending[gift.id];
        render();
        toast('Не получилось, попробуй ещё раз');
        haptic('error');
      });
  }

  function onChoose(gift) {
    if (state.readOnly || state.pending[gift.id]) return;
    send('choose', gift);
  }

  function onCancel(gift) {
    if (state.readOnly || state.pending[gift.id]) return;
    askConfirm('Отменить выбор?').then(function (ok) {
      if (ok) send('cancel', gift);
    });
  }

  load();
})();
</script>
